name: Build Moje miska Android APK
on:
  push:
    branches: [test/moje-miska-android-apk]
    paths:
      - "mobile/app/**"
      - ".github/workflows/build-moje-miska-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MojeMiska-test-APK
          path: mobile/app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct download on test branch
        run: |
          mkdir -p ../releases
          cp app/build/outputs/apk/debug/app-debug.apk ../releases/MojeMiska-test.apk
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile/releases/MojeMiska-test.apk
          git commit -m "Build test APK for Android tablet"
          git push origin HEAD:test/moje-miska-android-apk
